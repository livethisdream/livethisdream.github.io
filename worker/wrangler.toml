name = "wishlist-marks"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
ALLOWED_ORIGINS = "https://livethisdream.github.io,http://localhost:5173"
WISHLIST_URL = "https://livethisdream.github.io/wishlist.json"

# Create with: npx wrangler kv namespace create MARKS
# then paste the id it prints below.
[[kv_namespaces]]
binding = "MARKS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
