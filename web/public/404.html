<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>N. Rogers</title>
    <script>
      // GitHub Pages SPA redirect (Rafgraph pattern).
      // Any 404 (deep link, refresh on subroute) lands here; we rewrite the
      // path/query/hash into a single-string query on the site root, then
      // the SPA's index.html unwinds it back into a proper URL before React
      // Router boots. Result: BrowserRouter routes work on refresh + deep-link.
      //
      // pathSegmentsToKeep must be 0 for a user-site (livethisdream.github.io)
      // that serves at the domain root. For project sites (github.io/repo/)
      // it would be 1.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
