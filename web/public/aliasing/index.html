<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#004a85">
<meta name="description" content="Aliasing, interactively: a wagon wheel filmed by a camera, its shadow over time, and the spectrum that folds.">
<title>Aliasing: the Wagon Wheel</title>
<style>
  :root { --navy:#004a85; --mid:#0067b9; --edge:#cddce9; --edge2:#b9d2e5; --bg:#f5f9fc;
          --ink:#15202b; --ink3:#5b6573; --red:#b01e24; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:#fff; color:var(--ink);
              font-family:Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; }
  main { max-width:1000px; margin:0 auto; padding:20px 16px 40px; }
  .back { font-size:13px; color:var(--mid); text-decoration:none; font-weight:600; }
  .back:hover { text-decoration:underline; }
  h1 { color:var(--navy); font-weight:800; font-size:clamp(26px,4vw,36px); line-height:1.15; margin:10px 0 14px; }
  h1::after { content:''; display:block; width:2.5em; height:4px; background:var(--mid); border-radius:2px; margin-top:0.35em; }
  .controls { display:grid; grid-template-columns:1fr 1fr auto; gap:10px 22px; align-items:center;
              padding:10px 14px; background:var(--bg); border:1px solid var(--edge); border-radius:8px; }
  .ctl { display:flex; align-items:center; gap:10px; min-width:0; }
  .ctl label { font-size:13px; color:var(--ink3); font-weight:700; white-space:nowrap; }
  .ctl .val { color:var(--navy); font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; min-width:84px; text-align:right; }
  .ctl input[type=range] { flex:1 1 auto; min-width:90px; accent-color:var(--mid); }
  .btns { display:flex; gap:8px; }
  .btns button { font:inherit; font-size:12px; font-weight:700; padding:6px 12px; border-radius:6px; border:1px solid var(--edge2); background:#fff; color:var(--navy); cursor:pointer; }
  .btns button:focus-visible { outline:2px solid var(--navy); outline-offset:2px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
  .panel { border:1px solid var(--edge); border-radius:8px; background:#fff; padding:10px; min-width:0; }
  .panel h2 { font-size:13px; text-transform:uppercase; letter-spacing:0.05em; color:var(--navy); margin:0 0 6px; font-weight:800; }
  .wide { grid-column:1 / -1; }
  canvas { display:block; width:100%; }
  .readout { text-align:center; margin-top:6px; font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; }
  .readout small { font-size:13px; font-weight:500; color:var(--ink3); }
  #rTrue { color:var(--ink); }
  #rAlias { color:var(--red); }
  @media (max-width:620px) { .controls { grid-template-columns:1fr; } .btns { justify-self:start; } }
</style>
</head>
<body>
<main>
  <a class="back" href="/">← livethisdream.github.io</a>
  <h1>Aliasing: the Wagon Wheel</h1>

  <div class="controls">
    <div class="ctl">
      <label for="f0">wheel f<sub>0</sub></label>
      <input type="range" id="f0" min="-3" max="3" step="0.01" value="0.9">
      <span class="val" id="f0v">—</span>
    </div>
    <div class="ctl">
      <label for="fs">camera f<sub>s</sub></label>
      <input type="range" id="fs" min="2" max="12" step="0.5" value="6">
      <span class="val" id="fsv">—</span>
    </div>
    <div class="btns">
      <button type="button" id="play" aria-pressed="true">Pause</button>
      <button type="button" id="step" title="Pause and advance one camera frame">Step ▸</button>
    </div>
  </div>

  <div class="grid">
    <section class="panel">
      <h2>Wheel</h2>
      <canvas id="wTrue" aria-label="The wheel spinning at its true speed"></canvas>
      <div class="readout"><span id="rTrue">—</span> <small>rev/s</small></div>
    </section>
    <section class="panel">
      <h2>Camera</h2>
      <canvas id="wCam" aria-label="The wheel as the camera records it, one frame at a time"></canvas>
      <div class="readout"><span id="rAlias">—</span> <small>rev/s</small></div>
    </section>
    <section class="panel wide">
      <h2>Shadow of the red spoke</h2>
      <canvas id="cTime" aria-label="Horizontal position of the red spoke's tip against time: the true motion, the camera's samples, and the aliased wave through them"></canvas>
    </section>
    <section class="panel wide">
      <h2>Spectrum</h2>
      <canvas id="cSpec" aria-label="Spectrum of the sampled shadow: copies every fs, the band from minus fs/2 to plus fs/2 shaded, and the copies that land in it in red"></canvas>
    </section>
  </div>
</main>

<script>
'use strict';
const C = { navy:'#004a85', mid:'#0067b9', edge:'#cddce9', bg:'#f5f9fc', ink:'#15202b',
            ink3:'#5b6573', red:'#b01e24', gray:'#9aa6b2', light:'#a9c9e6', amber:'#8a5a00' };
const SANS = "Inter, system-ui, -apple-system, 'Segoe UI', sans-serif";
const $ = id => document.getElementById(id);

const S = { ratio: 0.9, fs: 6, playing: true, t: 0 };
const f0 = () => S.ratio * S.fs;
// The rotation's alias wraps into [-fs/2, fs/2); the shadow's folds into [0, fs/2].
function wrap(f, fs) { let a = f - fs * Math.round(f / fs); if (a >= fs / 2 - 1e-9) a -= fs; return a; }
const fold = (f, fs) => Math.abs(wrap(f, fs));
const signed = v => { const x = Math.abs(v) < 0.005 ? 0 : v; return (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(2); };

function prep(cv, hFn) {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth || 300, h = hFn(w);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); cv.style.height = h + 'px';
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  return { ctx, w, h };
}
function txt(ctx, s, x, y, px, color, align = 'center') {
  ctx.fillStyle = color; ctx.font = px + 'px ' + SANS; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function arrow(ctx, x1, y1, x2, y2, color, width = 2, head = 9) {
  const len = Math.hypot(x2 - x1, y2 - y1); if (len < 2) return;
  const a = Math.atan2(y2 - y1, x2 - x1), hd = Math.min(head, len * 0.6);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - hd * 0.7 * Math.cos(a), y2 - hd * 0.7 * Math.sin(a)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - hd * Math.cos(a - 0.42), y2 - hd * Math.sin(a - 0.42));
  ctx.lineTo(x2 - hd * Math.cos(a + 0.42), y2 - hd * Math.sin(a + 0.42)); ctx.closePath(); ctx.fill();
}
const tickLabel = k => k === 0 ? '0' : (k < 0 ? '−' : '') + (Math.abs(k) === 1 ? '' : Math.abs(k)) + 'fs';

// ---------- wheels: counterclockwise is positive ----------
const SPOKES = 8;
function drawWheel(cv, angles, ghost) {
  const { ctx, w, h } = prep(cv, w => Math.min(240, Math.max(150, w * 0.75)));
  const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 10;
  const P = (a, r) => [cx + r * Math.cos(-a), cy + r * Math.sin(-a)];
  ctx.fillStyle = C.bg; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 2 * Math.PI); ctx.fill();
  ctx.strokeStyle = C.navy; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 2 * Math.PI); ctx.stroke();
  ctx.lineCap = 'round';
  if (ghost !== undefined) {
    ctx.globalAlpha = 0.22; ctx.strokeStyle = C.red; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(...P(ghost, R * 0.92)); ctx.stroke(); ctx.globalAlpha = 1;
  }
  const n = angles.length;
  for (const th of angles) {
    ctx.globalAlpha = n === 1 ? 1 : Math.max(0.06, 1.6 / n);
    ctx.strokeStyle = C.gray; ctx.lineWidth = 3;
    for (let k = 1; k < SPOKES; k++) { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(...P(th + 2 * Math.PI * k / SPOKES, R * 0.97)); ctx.stroke(); }
    ctx.strokeStyle = C.red; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(...P(th, R * 0.97)); ctx.stroke();
    ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(...P(th, R * 0.97), 6, 0, 2 * Math.PI); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = C.navy; ctx.beginPath(); ctx.arc(cx, cy, 8, 0, 2 * Math.PI); ctx.fill();
  return { ctx, cx, cy, R };
}
function turnArrow(g, f, color) {
  if (Math.abs(f) < 0.005) return;
  const { ctx, cx, cy, R } = g, a0 = -2.25, span = 0.9 * Math.sign(f);
  const P = a => [cx + R * Math.cos(-a), cy + R * Math.sin(-a)];
  ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.beginPath();
  for (let i = 0; i <= 20; i++) { const p = P(a0 + span * i / 20); i ? ctx.lineTo(...p) : ctx.moveTo(...p); }
  ctx.stroke();
  arrow(ctx, ...P(a0 + span * 0.8), ...P(a0 + span), color, 2.5, 10);
}
function drawWheels(dt) {
  const f = f0(), fs = S.fs, th = 2 * Math.PI * f * S.t, d = S.playing ? (dt || 1 / 60) : 0;
  // motion blur over one display frame, so the screen's own refresh does not alias the true wheel
  const M = Math.max(1, Math.min(48, Math.ceil(Math.abs(f) * d * SPOKES * 6)));
  const angs = []; for (let i = 0; i < M; i++) angs.push(th - 2 * Math.PI * f * d * i / M);
  turnArrow(drawWheel($('wTrue'), angs), f, C.ink);
  const n = Math.floor(S.t * fs), fw = wrap(f, fs);
  const g = drawWheel($('wCam'), [2 * Math.PI * f * n / fs], 2 * Math.PI * f * (n - 1) / fs);
  turnArrow(g, Math.abs(Math.abs(fw) - fs / 2) < 1e-6 ? 0 : fw, C.red);
}

// ---------- shadow over time ----------
function drawTime() {
  const { ctx, w, h } = prep($('cTime'), w => Math.min(190, Math.max(140, w * 0.17)));
  const fs = S.fs, f = f0(), fa = fold(f, fs), T = 10 / fs, t1 = S.t, t0 = t1 - T;
  const mL = 8, mR = 8, mT = 8, mB = 8, pw = w - mL - mR, ph = h - mT - mB, y0 = mT + ph / 2;
  const X = t => mL + (t - t0) / T * pw, Y = v => y0 - v * (ph / 2 - 6);
  ctx.strokeStyle = '#eef3f8'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(mL, y0); ctx.lineTo(mL + pw, y0); ctx.stroke();
  const N = Math.max(600, Math.ceil(Math.abs(f) * T * 40));
  ctx.strokeStyle = C.gray; ctx.lineWidth = 1.3; ctx.beginPath();
  for (let i = 0; i <= N; i++) { const t = t0 + T * i / N; i ? ctx.lineTo(X(t), Y(Math.cos(2 * Math.PI * f * t))) : ctx.moveTo(X(t), Y(Math.cos(2 * Math.PI * f * t))); }
  ctx.stroke();
  // cos(2 pi fa t) passes through every sample of cos(2 pi f t)
  ctx.strokeStyle = C.red; ctx.lineWidth = 2.4; ctx.setLineDash([7, 4]); ctx.beginPath();
  for (let i = 0; i <= 400; i++) { const t = t0 + T * i / 400; i ? ctx.lineTo(X(t), Y(Math.cos(2 * Math.PI * fa * t))) : ctx.moveTo(X(t), Y(Math.cos(2 * Math.PI * fa * t))); }
  ctx.stroke(); ctx.setLineDash([]);
  for (let n = Math.ceil(t0 * fs); n <= Math.floor(t1 * fs); n++) {
    const t = n / fs; ctx.fillStyle = C.mid; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(X(t), Y(Math.cos(2 * Math.PI * f * t)), 5, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
  }
}

// ---------- spectrum of the sampled shadow ----------
function drawSpec() {
  const { ctx, w, h } = prep($('cSpec'), w => Math.min(230, Math.max(170, w * 0.22)));
  const fs = S.fs, f = f0(), lo = -3.25, hi = 3.25;
  const mL = 14, mR = 14, mT = 22, mB = 26, pw = w - mL - mR, base = h - mB, H = base - mT;
  const X = r => mL + (r - lo) / (hi - lo) * pw;
  ctx.fillStyle = 'rgba(0,103,185,0.09)'; ctx.fillRect(X(-0.5), mT - 14, X(0.5) - X(-0.5), base - mT + 14);
  // fold lines at odd multiples of fs/2
  ctx.setLineDash([3, 4]); ctx.strokeStyle = C.amber; ctx.lineWidth = 1;
  for (let k = -2.5; k <= 2.5; k += 1) { ctx.beginPath(); ctx.moveTo(X(k), mT - 14); ctx.lineTo(X(k), base); ctx.stroke(); }
  ctx.setLineDash([]);
  ctx.strokeStyle = C.ink3; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(mL, base); ctx.lineTo(mL + pw, base); ctx.stroke();
  for (let k = -3; k <= 3; k++) {
    ctx.beginPath(); ctx.moveTo(X(k), base); ctx.lineTo(X(k), base + 5); ctx.stroke();
    txt(ctx, tickLabel(k), X(k), base + 15, 12, C.ink3);
  }
  const stem = (r, ht, color, width) => {
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath(); ctx.moveTo(X(r), base); ctx.lineTo(X(r), base - ht); ctx.stroke();
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(r), base - ht, width + 1.5, 0, 2 * Math.PI); ctx.fill();
  };
  const inBand = r => r >= -0.5 - 1e-9 && r <= 0.5 + 1e-9;
  const red = [];
  for (const t of [f, -f]) for (let k = -9; k <= 9; k++) {
    const r = (t + k * fs) / fs; if (r < lo || r > hi) continue;
    if (inBand(r)) red.push(r); else if (k !== 0) stem(r, H * 0.6, C.light, 2);
  }
  // the actual tones, dashed, unless they already sit in the band
  for (const t of [f, -f]) {
    const r = t / fs; if (r < lo || r > hi || inBand(r)) continue;
    ctx.setLineDash([5, 4]); ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(X(r), base); ctx.lineTo(X(r), base - H); ctx.stroke(); ctx.setLineDash([]);
  }
  for (const r of red) stem(r, H, C.red, 3);
  // where the positive tone lands
  const rf = f / fs, ra = Math.sign(rf || 1) * fold(f, fs) / fs;
  if (Math.abs(rf - ra) > 0.02 && rf >= lo && rf <= hi) {
    const y = base - H * 0.8, xa = X(rf), xb = X(ra), s = Math.sign(xa - xb);
    ctx.strokeStyle = C.red; ctx.lineWidth = 1.6; ctx.beginPath();
    ctx.moveTo(xa - s * 4, y); ctx.quadraticCurveTo((xa + xb) / 2, y - Math.min(30, Math.abs(xb - xa) * 0.2), xb + s * 10, y - 2); ctx.stroke();
    arrow(ctx, xb + s * 18, y - 3, xb + s * 6, y - 1, C.red, 1.6, 8);
  }
}

function drawAll(dt) {
  drawWheels(dt); drawTime(); drawSpec();
  const f = f0(), fs = S.fs, fw = wrap(f, fs);
  $('f0v').textContent = signed(f) + ' rev/s';
  $('fsv').textContent = S.fs.toFixed(1) + ' frames/s';
  $('rTrue').textContent = signed(f);
  $('rAlias').textContent = Math.abs(Math.abs(fw) - fs / 2) < 1e-6 ? '±' + (fs / 2).toFixed(2) : signed(fw);
}

$('f0').addEventListener('input', e => { S.ratio = parseFloat(e.target.value); drawAll(); });
$('fs').addEventListener('input', e => { S.fs = parseFloat(e.target.value); drawAll(); });   // f0 keeps its ratio to fs
const playBtn = $('play');
let lastTs = null;
function setPlaying(on) {
  S.playing = on; playBtn.textContent = on ? 'Pause' : 'Play'; playBtn.setAttribute('aria-pressed', on);
  if (on) { lastTs = null; requestAnimationFrame(tick); }
}
playBtn.addEventListener('click', () => setPlaying(!S.playing));
// Step: pause, then jump to the next camera frame, so each click is one sample.
$('step').addEventListener('click', () => {
  setPlaying(false);
  S.t = (Math.floor(S.t * S.fs + 1e-6) + 1) / S.fs + 1e-9;
  drawAll();
});
function tick(ts) {
  if (!S.playing) return;
  const dt = lastTs === null ? 1 / 60 : Math.min(0.1, (ts - lastTs) / 1000);
  lastTs = ts; S.t += dt; drawAll(dt);
  requestAnimationFrame(tick);
}
window.addEventListener('resize', () => drawAll());
drawAll();
setPlaying(!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches));
</script>
</body>
</html>
