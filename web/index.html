<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#004a85" />
    <meta name="description" content="Neil Rogers — RF Field Applications Engineer at Analog Devices. Teaching antennas, phased arrays, and radar at USAFA." />
    <title>N. Rogers</title>
    <script>
      // GitHub Pages SPA redirect (Rafgraph pattern) — unwind the query-string
      // form back into a proper URL before React Router boots. Runs only when
      // /?/some/route arrives from 404.html.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <script>
      // The old Chirpy-era site registered a PWA service worker that cached
      // every page; returning visitors get that stale site until it's removed.
      // /sw.js + /sw.min.js are kill-switch workers that handle it, but also
      // unregister and purge here in case this page loads first.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) { reg.unregister(); });
        });
      }
      if (window.caches) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) { caches.delete(key); });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
