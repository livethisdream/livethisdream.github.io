name: Build and Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # URL of the wishlist Worker (worker/). Uses the VITE_WISHLIST_API repo
      # variable if set; otherwise asks Cloudflare, if the token secret exists.
      # Neither -> the wishlist renders read-only.
      - name: Find wishlist Worker
        id: wishlist
        env:
          VITE_WISHLIST_API: ${{ vars.VITE_WISHLIST_API }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          url="$VITE_WISHLIST_API"
          if [ -z "$url" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            acct=$(../worker/scripts/cf.sh account) &&
              url=$(../worker/scripts/cf.sh url "$acct" wishlist-marks) || url=
          fi
          if [ -n "$url" ] && ! curl -sf -m 10 "$url/marks" | jq -e '.marks' >/dev/null; then
            echo "::warning::$url isn't answering; building the wishlist read-only."
            url=
          fi
          echo "Wishlist API: ${url:-none (read-only)}"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build
        env:
          VITE_WISHLIST_API: ${{ steps.wishlist.outputs.url }}

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
